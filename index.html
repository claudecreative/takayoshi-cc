<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TOKYO CC WORKS</title>
<style>
:root{--color-bg:#f6f7f9;--color-panel:#ffffff;--color-fg:#1f2329;--color-fg-muted:#667085;--color-border-line:#e6e8ec;

@media (prefers-color-scheme: dark){:root{--color-bg:#14171b;--color-panel:#1c2026;--color-fg:#e7eaee;--color-fg-muted:#9aa3b2;--color-border-line:#2c323a;
--cds-border:#2c323a;--cds-chart-grid:#262b32;--cds-surface-popover:#232830;--cds-text-secondary:#9aa3b2;--cds-shadow-popover:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:14px;line-height:1.6}
#dash-root{max-width:1200px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left,0px)) 32px max(12px,env(safe-area-inset-right,0px))}
.lockwrap{min-height:90vh;display:grid;place-items:center;padding:16px}
.lockcard{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:16px;padding:28px 24px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.lockcard h1{margin:0;font-size:18px}.lockcard h1 span{color:#00b45a}
.lockcard p{margin:0;color:var(--color-fg-muted);font-size:13px}
.lockcard input{font:inherit;padding:10px 12px;border:1px solid var(--color-border-line);border-radius:10px;background:var(--color-bg);color:var(--color-fg)}
.lockcard button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#00b45a;color:#fff;font-weight:700;cursor:pointer}
.lockcard .rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--color-fg-muted)}.lockcard .rem input{padding:0}
.lockcard .err{color:#d93d42;font-size:13px;min-height:1.2em}
</style>
</head>

<div class="lockwrap" id="lock">
  <form class="lockcard" id="lockform" autocomplete="off">

    <p>パスワードを入れてください。</p>
    <input type="password" id="pw" aria-label="パスワード" autofocus>
    <label class="rem"><input type="checkbox" id="remember" checked> この端末で記憶する（次回から入力不要）</label>

    <div class="err" id="err" role="alert"></div>

</div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw){
  const k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, k0, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function makeDash(src){
  const calcs = {}, draws = {}, cache = {};
  const get = (id) => {
    if (id in src) return {status:'ok', data:src[id], columns: src[id][0] ? Object.keys(src[id][0]) : [], refreshing:false, truncated:false, meta:null};
    if (calcs[id]) { if (!(id in cache)) cache[id] = calcs[id].fn(...calcs[id].inputs.map((i) => get(i).data)); return {status:'ok', data:cache[id], refreshing:false, truncated:false, meta:null}; }
    return {status:'missing', data:[], message:'missing'};
  };
  const run = (name) => { const fn = draws[name]; if (!fn) return; document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => { try { fn(el); } catch (e) { console.error(name, e); } }); };
  return {
    data: get,
    calc: (id, spec) => { calcs[id] = spec; },
    loader: () => {},
    draw: (name, fn) => { if (fn) draws[name] = fn; run(name); },
    onData: (fn) => fn(),
    params: () => ({}), setParams: () => {}, resetParams: () => {}, setLink: () => {}, refresh: () => {},
    colors: ['#00b45a','#3d8bfd','#f59e0b','#f0506e','#8b7cf6','#14b8a6'],
    _all: () => Object.keys(draws).forEach(run)
  };
}
const KEY='tokyo-cc-pw', DAYS=3650;
async function openDash(pw){
  const p = await decrypt(pw);
  window.dash = makeDash(p.data);
  const root = document.getElementById('dash-root');
  const tpl = document.createElement('template'); tpl.innerHTML = p.html;
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach((s) => s.remove());
  root.replaceChildren(tpl.content);
  document.getElementById('lock').hidden = true; root.hidden = false;
  for (const s of scripts) { try { (0, eval)(s.textContent); } catch (x) { console.error(x); } }
  window.dash._all();
  let w = root.clientWidth; window.addEventListener('resize', () => { if (root.clientWidth !== w) { w = root.clientWidth; window.dash._all(); } });
}
function saved(){ try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && v.exp > Date.now()) return v.pw; localStorage.removeItem(KEY); } catch (x) {} return null; }
document.getElementById('lockform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const pw = document.getElementById('pw').value;
  try { await openDash(pw); } catch (x) { err.textContent = 'パスワードが違います'; return; }
  try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, JSON.stringify({pw, exp: Date.now() + DAYS*864e5})); else localStorage.removeItem(KEY); } catch (x) {}
});
(async () => { const pw = saved(); if (!pw) return; document.getElementById('lock').hidden = true; try { await openDash(pw); } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} document.getElementById('lock').hidden = false; } })();
</script>
